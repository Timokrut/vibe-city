<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6ef" />
    <script>
      const preferredTheme = matchMedia("(prefers-color-scheme: dark)");
      const savedTheme = localStorage.getItem("atlas-theme");
      document.documentElement.dataset.theme =
        savedTheme || (preferredTheme.matches ? "dark" : "light");
    </script>
    <link
      rel="preload"
      href="/assets/fonts/cormorant-garamond-latin-600-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Atlas</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="/" id="brand"
          ><img src="/assets/mark.svg" width="40" height="40" alt="" /><span
            id="brand-name"
            >Atlas</span
          ></a
        >
        <div class="head-tools">
          <button class="rules-link" id="rules"></button>
          <button
            id="theme"
            class="theme-button"
            type="button"
            aria-label="Тёмная тема"
          ></button>
          <button
            id="fullscreen"
            type="button"
            class="theme-button"
            aria-label="Полный экран"
            aria-pressed="false"
          ></button>
          <div class="langs" aria-label="Language">
            <button lang="ru" data-lang="ru">RU</button
            ><button lang="en" data-lang="en">EN</button>
          </div>
        </div>
      </div>
    </header>
    <p id="screen-notice" role="status"></p>
    <main id="main"></main>
    <dialog id="modal"><div id="dialog-content"></div></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
